[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "graph-data-platform"
version = "0.1.0"
description = "Enterprise graph data platform: governed ingestion, entity resolution, versioned graph store, traversal and quality"
requires-python = ">=3.10"
[tool.setuptools.packages.find]
include = ["graph_data_platform*"]
